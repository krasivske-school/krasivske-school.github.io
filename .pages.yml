# Налаштування адмінки Pages CMS (https://pagescms.org).
# Увійдіть на app.pagescms.org через GitHub і виберіть цей репозиторій.

media:
  input: public/uploads
  output: /uploads

content:
  - name: news
    label: Новини
    type: collection
    path: src/content/news
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: date, label: Дата, type: date, required: true }
      - { name: cover, label: Головне фото (на картці новини), type: image }
      - name: photosFolder
        label: "Папка з фото (назва папки в public/uploads/galereia — усі фото з неї з'являться в галереї)"
        type: string
      - name: gallery
        label: Окремі фото для галереї (додавайте по одному)
        type: image
        options:
          multiple: true
      - { name: draft, label: Чернетка (не показувати на сайті), type: boolean }
      - { name: body, label: Текст новини, type: rich-text }

  - name: pages
    label: Сторінки
    type: collection
    path: src/content/pages
    view:
      fields: [title, section]
    fields:
      - { name: title, label: Назва, type: string, required: true }
      - name: section
        label: Розділ
        type: select
        required: true
        options:
          values:
            - { value: pro-nas, label: Про нас }
            - { value: batkam, label: Батькам }
            - { value: dokumenty, label: Документи }
            - { value: novyny, label: Новини }
      - { name: group, label: Підрозділ (наприклад «Вступ», «Безпека»), type: string }
      - { name: order, label: Порядок у списку, type: number }
      - { name: description, label: Короткий опис, type: text }
      - { name: body, label: Текст сторінки, type: rich-text }

  - name: documents
    label: Документи
    type: file
    path: src/data/documents.json
    format: json
    fields:
      - name: documents
        label: Документи
        type: object
        list: true
        fields:
          - { name: title, label: Назва документа, type: string, required: true }
          - name: category
            label: Категорія
            type: select
            required: true
            options:
              values:
                - { value: ustanovchi, label: Установчі документи }
                - { value: litsenzuvannia, label: Ліцензування }
                - { value: osvitni-prohramy, label: Освітні програми }
                - { value: zvitnist, label: Звітність і фінанси }
                - { value: atestatsiia, label: Атестація педагогів }
                - { value: pidruchnyky, label: Вибір підручників }
                - { value: bezpeka, label: Безпека і протидія булінгу }
                - { value: batkam, label: Для батьків }
          - { name: year, label: Рік, type: string }
          - { name: url, label: "Файл або посилання (PDF завантажте в «Медіа» і вставте шлях /uploads/...)", type: string, required: true }
      - name: categories
        label: Категорії
        type: object
        list: true
        fields:
          - { name: id, label: Код, type: string }
          - { name: title, label: Назва, type: string }

  - name: site
    label: Контакти і загальна інформація
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Коротка назва, type: string }
      - { name: fullName, label: Повна назва, type: string }
      - { name: tagline, label: Підпис над назвою на головній, type: string }
      - { name: about, label: Про заклад (абзац на головній), type: text }
      - name: facts
        label: Цифри на головній
        type: object
        list: true
        fields:
          - { name: value, label: Значення, type: string }
          - { name: label, label: Підпис, type: string }
      - name: contacts
        label: Контакти
        type: object
        fields:
          - { name: address, label: Адреса, type: string }
          - { name: phone, label: Телефон, type: string }
          - { name: phoneNote, label: Чий телефон, type: string }
          - { name: email, label: E-mail, type: string }
          - { name: facebook, label: Посилання на Facebook, type: string }
          - { name: mapUrl, label: Посилання на мапу, type: string }
      - name: hotlines
        label: Телефони довіри
        type: object
        list: true
        fields:
          - { name: name, label: Назва, type: string }
          - { name: phone, label: Телефон, type: string }
          - { name: note, label: Примітка, type: string }
      - name: administration
        label: Адміністрація
        type: object
        list: true
        fields:
          - { name: role, label: Посада, type: string }
          - { name: name, label: ПІБ, type: string }
          - { name: details, label: Відомості, type: string, list: true }
          - { name: phone, label: Телефон, type: string }
